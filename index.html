<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Хангук Сабақ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한국어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: one-column study app; sticky level bar on top, tab bar on the bottom, bottom sheets for words. Celadon (청자) accent, ink text, yellow transcription band carried over from the printed binders. */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface2:#eaefec; --line:#d6dfda;
  --ink:#1c2622; --ink2:#5b6a64; --ink3:#8a9893;
  --accent:#2f7d6d; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --tr-bg:#fff6cc; --tr-ink:#6b5600;
  --know:#2f8a4f; --know-soft:#dff2e5; --nope:#c4473b; --nope-soft:#f8e1de;
  --deep:#4a63b5; --deep-soft:#e2e7f7;
  --shadow:0 8px 28px rgba(20,40,34,.12);
  --f-body:'Noto Sans',system-ui,-apple-system,sans-serif;
  --f-ko:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --f-ko-display:'Noto Serif KR','Noto Sans KR',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --surface2:#222c28; --line:#2e3a35;
  --ink:#e6eeea; --ink2:#a3b2ab; --ink3:#71817a;
  --accent:#5fbfa9; --accent-ink:#0d1714; --accent-soft:#1f3a33;
  --tr-bg:#3a3313; --tr-ink:#f1dc84;
  --know:#5cc77f; --know-soft:#1d3527; --nope:#ef7a6e; --nope-soft:#3d2321;
  --deep:#8ea3ee; --deep-soft:#242c47;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --surface2:#222c28; --line:#2e3a35;
  --ink:#e6eeea; --ink2:#a3b2ab; --ink3:#71817a;
  --accent:#5fbfa9; --accent-ink:#0d1714; --accent-soft:#1f3a33;
  --tr-bg:#3a3313; --tr-ink:#f1dc84;
  --know:#5cc77f; --know-soft:#1d3527; --nope:#ef7a6e; --nope-soft:#3d2321;
  --deep:#8ea3ee; --deep-soft:#242c47;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.ko{font-family:var(--f-ko)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-ko-display);font-weight:700;font-size:20px;letter-spacing:-.5px;color:var(--accent)}
.brand small{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.top-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:19px;height:19px}
.levels{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.lv.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink3);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}

/* generic */
h2.sec{font-size:19px;margin:6px 0 4px;text-wrap:balance}
h3.blk{font-size:16px;margin:22px 0 6px;text-wrap:balance}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.row-gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:17px;height:17px}

/* theory */
.intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 10px;font-size:14px}
.intro p{margin:0 0 6px}.intro p:last-child{margin:0}
.pat{padding:10px 0;border-top:1px solid var(--line)}
.pat-t{font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:baseline}
.pat-t .go{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;white-space:nowrap}

/* sentences */
.sent{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.sent:first-child{border-top:0}
.spk{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--accent);grid-row:span 4;align-self:start}
.spk svg{width:16px;height:16px}
.spk.playing{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.s-ko{font-family:var(--f-ko);font-size:18px;line-height:1.55;min-width:0}
.w{border-radius:5px;padding:0 1px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.w:hover{background:var(--accent-soft)}
.w.hit{background:var(--tr-bg);box-shadow:0 0 0 1px var(--tr-ink) inset}
.s-tr{justify-self:start;background:var(--tr-bg);color:var(--tr-ink);font-size:13px;border-radius:6px;padding:0 6px}
.s-kz{font-size:14px;min-width:0}
.s-cq{font-size:12px;color:var(--ink3);min-width:0}
.hide-kz .s-kz,.hide-kz .s-cq{filter:blur(5px);cursor:pointer;user-select:none}
.hide-kz .s-kz.show,.hide-kz .s-cq.show{filter:none}
.card-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 14px;margin-bottom:12px}
.prbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,96px));z-index:15;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 8px calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);box-shadow:0 6px 12px -10px rgba(0,0,0,.25)}
.prbar .chips{margin-bottom:6px}
.pat-head{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--toph,96px) + 100px);display:flex;align-items:flex-start;gap:8px;margin:18px 0 8px}
.pat-head h3{margin:0;font-size:15.5px;flex:1;text-wrap:balance}

/* vocab */
.vg{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.vg-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface2)}
.vg-h b{font-size:14px;flex:1;min-width:0}
.vr{display:grid;grid-template-columns:28px minmax(0,1.1fr) minmax(0,1fr) 34px;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.vr:first-of-type{border-top:0}
.vr .em{font-size:20px;text-align:center}
.vr .k{font-family:var(--f-ko);font-size:17px;line-height:1.25}
.vr .k small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--tr-ink);background:var(--tr-bg);border-radius:4px;padding:0 4px;width:max-content;max-width:100%;margin-top:2px}
.vr .m{font-size:13.5px;line-height:1.3}
.vr .m small{display:block;color:var(--ink3);font-size:11.5px}
.vr .spk{grid-row:auto;width:30px;height:30px}
.badge{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.vr.arch{opacity:.45}

/* decks */
.deck{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.deck:first-child{border-top:0}
.deck .dn{flex:1;min-width:0;font-size:14px}
.deck .dn small{display:block;color:var(--ink3);font-size:12px}
.nums{display:flex;gap:5px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.nums span{padding:1px 7px;border-radius:7px}
.n-due{background:var(--nope-soft);color:var(--nope)}
.n-new{background:var(--deep-soft);color:var(--deep)}
.n-all{background:var(--surface2);color:var(--ink2)}
.prog{height:4px;border-radius:2px;background:var(--surface2);margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--know)}

/* study screen */
.study{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.st-top{display:flex;align-items:center;gap:10px}
.st-title{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-count{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.stage{flex:1;position:relative;margin:12px 0;touch-action:none;min-height:0}
.fc{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;user-select:none;-webkit-user-select:none;will-change:transform;overflow:hidden}
.fc.anim{transition:transform .28s ease,opacity .28s ease}
.fc-ko{font-family:var(--f-ko-display);font-size:clamp(34px,11vw,56px);font-weight:700;line-height:1.15;letter-spacing:-1px;overflow-wrap:anywhere}
.fc-hint{position:absolute;bottom:16px;left:0;right:0;font-size:12px;color:var(--ink3)}
.fc-em{font-size:64px;line-height:1;margin-bottom:8px}
.fc-kz{font-size:22px;font-weight:700;line-height:1.25;text-wrap:balance}
.fc-ru{color:var(--ink2);font-size:14px;margin-top:2px}
.fc-tr{display:inline-block;margin-top:8px;background:var(--tr-bg);color:var(--tr-ink);border-radius:8px;padding:2px 10px;font-size:15px}
.fc-ex{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);width:100%;font-size:13.5px;text-align:left;display:grid;grid-template-columns:30px 1fr;gap:2px 8px}
.fc-ex .spk{width:28px;height:28px;grid-row:span 2}
.fc-ex .ko{font-size:16px}
.fc .spk.big{width:46px;height:46px;margin-top:12px;grid-row:auto}
.fc .spk.big svg{width:22px;height:22px}
.stamp{position:absolute;top:22px;font-weight:800;font-size:20px;letter-spacing:.06em;padding:4px 12px;border:3px solid;border-radius:10px;opacity:0;text-transform:uppercase}
.stamp.k{left:20px;color:var(--know);transform:rotate(-12deg)}
.stamp.n{right:20px;color:var(--nope);transform:rotate(12deg)}
.st-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sb{border:0;border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;cursor:pointer}
.sb svg{width:20px;height:20px}
.sb.n{background:var(--nope-soft);color:var(--nope)}
.sb.k{background:var(--know-soft);color:var(--know)}
.sb.d{background:var(--deep-soft);color:var(--deep)}
.sb.a{background:var(--surface2);color:var(--ink2)}
.st-help{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:8px}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:52px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:50}
.sheet{position:fixed;padding-top:8px;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:22px 22px 0 0;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow);
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.wd{padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.wd:last-of-type{border-bottom:0}
.wd-top{display:flex;gap:12px;align-items:center}
.wd-em{font-size:40px;line-height:1}
.wd-ko{font-family:var(--f-ko-display);font-size:28px;font-weight:700;line-height:1.2}
.wd-tr{display:inline-block;background:var(--tr-bg);color:var(--tr-ink);border-radius:6px;padding:0 7px;font-size:13.5px}
.wd-kz{font-size:18px;font-weight:700;margin-top:6px}
.wd-ru{color:var(--ink2);font-size:13.5px}
.wd-sub{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:12px 0 2px}
.wd .sent{padding:7px 0}
.wd .s-ko{font-size:16px}
.ai{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px}
.ai p{margin:0 0 6px}
.from{font-size:12px;color:var(--ink3)}

/* search */
.search-box{display:flex;gap:8px;margin-bottom:10px}
.search-box textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-family:var(--f-ko);font-size:17px;padding:10px 12px;resize:none;min-height:48px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.tokens .w{font-family:var(--f-ko);font-size:18px;background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:10px}

/* media */
.mitem{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.mitem:first-child{border-top:0}
.mitem .mi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;font-size:18px;background:var(--surface2)}
.mitem .mt{flex:1;min-width:0;font-size:14px}
.mitem .mt a{color:var(--ink);text-decoration:none;font-weight:600}
.mitem .mt small{display:block;color:var(--ink3);font-size:12px}
.lvl-tag{font-size:10.5px;font-weight:700;color:var(--deep);background:var(--deep-soft);padding:1px 6px;border-radius:6px;margin-left:4px}
.form{display:grid;gap:8px;margin-bottom:10px}
.form input,.form textarea{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;padding:10px 12px;min-width:0;width:100%}
.time-in{width:74px!important;padding:6px 8px!important;font-size:13px;text-align:center}

/* video */
.vwrap{position:relative;background:#000;border-radius:14px;overflow:hidden}
.vwrap video{width:100%;display:block;max-height:52vh}
.vsub{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;min-height:64px;font-family:var(--f-ko);font-size:20px;line-height:1.6;text-align:center}
.file-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.file-btn{border:1.5px dashed var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--surface);font-size:13px;font-weight:600}
.file-btn small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px;word-break:break-all}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;padding:9px 16px;border-radius:12px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.note{font-size:12.5px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:10px 12px;margin:8px 0}
@media (prefers-reduced-motion:reduce){.fc.anim,.toast{transition:none}}
#login{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 40px) max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px))}
#login .box{max-width:380px;margin:0 auto;display:grid;gap:12px}
#login h1{font-family:var(--f-ko-display);color:var(--accent);font-size:44px;margin:0;text-align:center}
#login p{margin:0;text-align:center}
#login input{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;width:100%}
#login .err{color:var(--nope);font-size:13px;text-align:center;min-height:18px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;padding:6px}
</style>
</head><body>
<div id="login" hidden><div class="box">
  <h1>한국어</h1><p class="muted">TOPIK сабақ · прогресс почтаңызда сақталады</p>
  <input id="lgEmail" type="email" placeholder="Почта" autocomplete="email" autocapitalize="off">
  <input id="lgPass" type="password" placeholder="Құпиясөз (кемінде 6 таңба)" autocomplete="current-password">
  <div class="err" id="lgErr"></div>
  <button class="btn" id="lgIn">Кіру</button>
  <button class="btn ghost" id="lgUp">Жаңа аккаунт ашу</button>
  <button class="linkbtn" id="lgReset">Құпиясөзді ұмыттым</button>
  <button class="linkbtn" id="lgSkip" style="color:var(--ink3)">Кірмей жалғастыру (прогресс тек телефонда)</button>
</div></div>

<header class="top">
  <div class="top-row">

const VOi=['а','э','я','йэ','о','е','ё','йе','о','ва','вэ','ве','йо','у','во','ве','ви','ю','ы','ый','и'];
// coda index → [final sound, carry-over onset index when next starts with ㅇ, kept part]
const CO=['', 'к','кк','кс','н','ндж','нһ','т','л','лк','лм','лп','лс','лт','лп','лһ','м','п','пс','т','сс','ң','т','ч','к','т','п','т'];
const FIN=['', 'к','к','к','н','н','н','т','л','к','м','л','л','л','п','л','м','п','п','т','т','ң','т','т','к','т','п','т'];
// on liaison: [stay, move-onset-index]
const LIA={1:['',0],2:['',1],3:['к',9],4:['',2],5:['н',12],6:['',2],7:['',3],8:['',5],9:['л',0],10:['л',6],11:['л',7],12:['л',9],13:['л',16],14:['л',17],15:['',5],16:['',6],17:['',7],18:['п',9],19:['',9],20:['',10],21:['ң',11],22:['',12],23:['',14],24:['',15],25:['',16],26:['',17],27:['',11]};
function dec(c){const n=c.charCodeAt(0)-0xAC00;if(n<0||n>11171)return null;return[Math.floor(n/588),Math.floor(n%588/28),n%28];}
return function(s){
  let out='';const ch=[...s];
  for(let i=0;i<ch.length;i++){
    const d=dec(ch[i]);
    if(!d){out+=ch[i];continue;}
    let [o,v,c]=d;
    if(d._o!==undefined)o=d._o;
    const prev=i>0?dec(ch[i-1]):null;
    const wordStart=!prev;
    let on=wordStart?ON0[o]:ON[o];
    if(ch[i]._carry!==undefined) on=ch[i]._carry;
    if(o===5&&!wordStart&&prev&&prev[2]===8) on='л';
    let vo=(o===11&&wordStart)?VOi[v]:VO[v];
    if(o===11&&v===6&&!wordStart) vo='йо';
    let fin='';
    if(c){
      const nx=i+1<ch.length?dec(ch[i+1]):null;
      if(nx&&nx[0]===11&&LIA[c]){ // liaison
        fin=LIA[c][0];
        const mi=LIA[c][1];
        ch[i+1]=Object.assign(new String(ch[i+1]),{_carry:ON[mi]===''?'':ON[mi]});
        if(c===21) ch[i+1]._carry='';
      } else if(nx&&nx[0]===5&&c===8){fin='л';}
      else fin=FIN[c];
    }
    out+=on+vo+fin;
  }
  return out;
};})();

const Store={
  srs:LS.get('srs',{}),my:LS.get('my',{}),media:LS.get('media',[]),t:LS.get('t',0),
  db:null,uid:null,sample:null,user:null,_timer:null,sharedMedia:null,synced:false,
  init(){
    const go=()=>{FB.onAuthStateChanged(FB.auth,async u=>{
      this.user=u;
      if(u){this.uid=u.uid;$('#login').hidden=true;await this.pull();}
      else{this.uid=null;this.synced=false;if(!LS.get('skip',false))$('#login').hidden=false;}
      render();
    })};
    if(window.FB)go();else addEventListener('fb-ready',go,{once:true});
  },
  ref(){return FB.doc(FB.db,'users',this.uid)},
  async pull(){
    try{const s=await FB.getDoc(this.ref());
      if(s.exists()){const d=s.data();
        if((d.t||0)>this.t){this.srs=JSON.parse(d.srs||'{}');this.my=JSON.parse(d.my||'{}');this.media=JSON.parse(d.media||'[]');this.t=d.t;this.saveLocal();}
        else if(this.t>(d.t||0))await this.push();
      }else if(this.t)await this.push();
      this.synced=true;
    }catch(e){this.synced=false}
  },
  saveLocal(){LS.set('srs',this.srs);LS.set('my',this.my);LS.set('media',this.media);LS.set('t',this.t)},
  touch(){this.t=Date.now();this.saveLocal();clearTimeout(this._timer);this._timer=setTimeout(()=>this.push(),1500)},
  async push(){if(!this.user)return;try{await FB.setDoc(this.ref(),{srs:JSON.stringify(this.srs),my:JSON.stringify(this.my),media:JSON.stringify(this.media),t:this.t,email:this.user.email||''});this.synced=true}catch(e){this.synced=false}},
};

/* ───────── spaced repetition ───────── */
const DAY=864e5;
const SRS={
  st(k){return Store.srs[k]||null},
  isNew(k){return !Store.srs[k]},
  isArch(k){return !!(Store.srs[k]&&Store.srs[k].a)},
  isDue(k){const s=Store.srs[k];return s&&!s.a&&s.d<=Date.now()},
  know(k){const s=Store.srs[k]||{i:0,d:0};const i=s.i>0?Math.round(s.i*2.5*10)/10:1;Store.srs[k]={i,d:Date.now()+i*DAY,a:0};Store.touch()},
  nope(k){Store.srs[k]={i:0,d:Date.now(),a:0};Store.touch()},
  deeper(k){const s=Store.srs[k]||{i:0};const i=Math.max(s.i||0,2)*4;Store.srs[k]={i,d:Date.now()+i*DAY,a:0};Store.touch()},
  arch(k){const s=Store.srs[k]||{i:0,d:0};Store.srs[k]={...s,a:1};Store.touch()},
  unarch(k){const s=Store.srs[k]||{i:0,d:0};Store.srs[k]={...s,a:0,d:Date.now()};Store.touch()},
  learned(k){const s=Store.srs[k];return s&&!s.a&&s.i>=1},
};

/* ───────── word index helpers ───────── */
function lexOf(k){return LEX[k]||Store.my[k]||null}
function exRef(ref){const [L,b,p,r]=ref;return DATA.lv[L].b[b].p[p].r[r]}
const PARTS=['이에요','예요','입니다','에서는','에게서','으로','에서','에게','한테','까지','부터','처럼','보다','하고','이랑','랑','께서','은','는','이','가','을','를','에','로','와','과','도','만','의','요','들'];
function findKeys(raw){
  const t=raw.replace(/[.,!?~…"“”‘’'()\[\]「」『』]/g,'').trim();
  if(!t)return [];
  if(DATA.tok[t]&&DATA.tok[t].length)return DATA.tok[t];
  if(LEX[t])return [t];
  if(Store.my[t])return [t];
  for(const p of PARTS){if(t.endsWith(p)&&t.length>p.length){const s=t.slice(0,-p.length);if(LEX[s])return [s];if(Store.my[s])return [s];const s2=s.replace(/들$/,'');if(LEX[s2])return [s2]}}
  return [];
}
function tokenize(ko){return ko.split(/(\s+)/).map(p=>/^\s+$/.test(p)||!p?p:`<span class="w" data-w="${esc(p)}">${esc(p)}</span>`).join('')}

/* ───────── decks ───────── */
function deckWords(id){
  const [kind,L,a,b]=id.split(':');
  if(kind==='p')return DATA.lv[L].b[a].p[b].w;
  if(kind==='v')return DATA.lv[L].v[a].g[b].r;
  if(kind==='my')return Object.keys(Store.my);
  if(kind==='lvp'){const s=new Set();DATA.lv[L].b.forEach(B=>B.p.forEach(P=>P.w.forEach(w=>s.add(w))));return [...s]}
  if(kind==='lvv'){const s=new Set();DATA.lv[L].v.forEach(V=>V.g.forEach(G=>G.r.forEach(w=>s.add(w))));return [...s]}
  return [];
}
function deckName(id){
  const [kind,L,a,b]=id.split(':');
  if(kind==='p')return DATA.lv[L].b[a].p[b].t;
  if(kind==='v')return DATA.lv[L].v[a].g[b].t||DATA.lv[L].v[a].t;
  if(kind==='my')return 'Менің сөздерім';
  if(kind==='lvp')return `TOPIK ${L} — барлық паттерн сөздері`;
  if(kind==='lvv')return `TOPIK ${L} — бүкіл сөздік`;
  return id;
}
function deckStats(ws){let due=0,nw=0,ok=0,ar=0;for(const k of ws){if(SRS.isArch(k)){ar++;continue}if(SRS.isNew(k))nw++;else if(SRS.isDue(k))due++;else ok++;}return {due,nw,ok,ar,n:ws.length}}
function numsHTML(st){return `<div class="nums">${st.due?`<span class="n-due" title="Қайталау">${st.due}</span>`:''}${st.nw?`<span class="n-new" title="Жаңа">${st.nw}</span>`:''}<span class="n-all" title="Барлығы">${st.n}</span></div>`}

let ST=null;
function openDeck(id){
  const ws=deckWords(id).filter(k=>!SRS.isArch(k));
  if(!ws.length){toast('Бұл топта белсенді карточка жоқ');return}
  const now=Date.now();
  const due=ws.filter(k=>SRS.isDue(k)).sort((a,b)=>Store.srs[a].d-Store.srs[b].d);
  const nw=ws.filter(k=>SRS.isNew(k));
  const later=ws.filter(k=>!SRS.isNew(k)&&!SRS.isDue(k)).sort((a,b)=>Store.srs[a].d-Store.srs[b].d);
  ST={id,q:[...due,...nw,...later],i:0,flip:false,ok:0,bad:0,firstLater:due.length+nw.length};
  Speech.stop();renderStudy();
}
function closeStudy(){ST=null;$('#layer').innerHTML='';Speech.stop();render()}
function cardFront(k){const x=lexOf(k)||{ko:k};return `<div class="fc-ko">${esc(x.ko)}</div>${spkBtn(x.ko.split('/')[0].trim(),'big')}<div class="fc-hint">Аудару үшін басыңыз</div>`}
function cardBack(k){
  const x=lexOf(k)||{ko:k};const refs=(DATA.exi[k]||[]);const ex=refs.length?exRef(refs[0]):null;
  const exHTML=ex?`<div class="fc-ex">${spkBtn(ex[0])}<div class="ko">${esc(ex[0])}</div><div class="muted">${esc(ex[2])}</div></div>`:(x.ex&&x.ex[0]?`<div class="fc-ex">${spkBtn(x.ex[0].ko)}<div class="ko">${esc(x.ex[0].ko)}</div><div class="muted">${esc(x.ex[0].kz)}</div></div>`:'');
  return `<div class="fc-em">${x.em||''}</div><div class="fc-ko" style="font-size:30px">${esc(x.ko)}</div><div class="fc-tr">${esc(x.tr||TR(x.ko))}</div>${spkBtn(x.ko.split('/')[0].trim(),'big')}<div class="fc-kz" style="margin-top:10px">${esc(x.kz||'')}</div><div class="fc-ru">${esc(x.ru||'')}</div>${exHTML}`;
}
function renderStudy(){
  const L=$('#layer');
  if(ST.i>=ST.q.length){
    L.innerHTML=`<div class="study"><div class="st-top"><button class="icon-btn" data-close-study>${IC.back}</button><div class="st-title">${esc(deckName(ST.id))}</div></div>
      <div class="done"><div class="big">🎉</div><h2>Топ аяқталды!</h2><p class="muted">Білемін: ${ST.ok} · Қайталаймын: ${ST.bad}</p><button class="btn" data-restart>Қайта бастау</button> <button class="btn ghost" data-close-study>Жабу</button></div></div>`;return;
  }
  const k=ST.q[ST.i];const st=SRS.st(k);
  const tag=SRS.isNew(k)?'жаңа':SRS.isDue(k)?'қайталау':`келесі: ${Math.max(1,Math.round((st.d-Date.now())/DAY))} күннен кейін`;
  L.innerHTML=`<div class="study">
    <div class="st-top"><button class="icon-btn" data-close-study aria-label="Жабу">${IC.back}</button><div class="st-title">${esc(deckName(ST.id))}</div><div class="st-count">${ST.i+1}/${ST.q.length}</div></div>
    <div class="muted small" style="text-align:center;margin-top:6px">${tag}</div>
    <div class="stage" id="stage"><div class="fc" id="fc"><div class="stamp k">Білемін</div><div class="stamp n">Білмеймін</div><div id="fcBody">${ST.flip?cardBack(k):cardFront(k)}</div></div></div>
    <div class="st-btns">
      <button class="sb n" data-rate="nope">${IC.x}Білмеймін</button>
      <button class="sb d" data-rate="deeper">${IC.down}Тереңге</button>
      <button class="sb a" data-rate="arch">${IC.box}Архив</button>
      <button class="sb k" data-rate="know">${IC.check}Білемін</button>
    </div>
    <div class="st-help">← білмеймін · білемін → · ↑ келесі · ↓ алдыңғы · басу — аудару</div>
  </div>`;
  bindSwipe();
  if(!ST.flip&&LS.get('autoSay',true)){const x=lexOf(k);if(x)setTimeout(()=>Speech.say(x.ko.split('/')[0].trim()),180)}
}
function flipCard(){ST.flip=!ST.flip;const k=ST.q[ST.i];$('#fcBody').innerHTML=ST.flip?cardBack(k):cardFront(k);}
function rate(kind,dir){
  if(!ST||ST.i>=ST.q.length)return;const k=ST.q[ST.i];
  if(kind==='know'){SRS.know(k);ST.ok++}
  else if(kind==='nope'){SRS.nope(k);ST.bad++;const pos=Math.min(ST.q.length,ST.i+4);ST.q.splice(pos,0,k)}
  else if(kind==='deeper'){SRS.deeper(k);toast('Сирек қайталанады')}
  else if(kind==='arch'){SRS.arch(k);toast('Архивке жіберілді')}
  animateOut(dir||({know:'r',nope:'l',deeper:'u',arch:'u'})[kind],()=>{ST.i++;ST.flip=false;renderStudy()});
}
function move(step){if(!ST)return;const ni=ST.i+step;if(ni<0){toast('Бұл бірінші карточка');snapBack();return}if(ni>=ST.q.length){toast('Соңғы карточка');snapBack();return}
  animateOut(step>0?'u':'d',()=>{ST.i=ni;ST.flip=false;renderStudy()})}
function animateOut(dir,cb){const fc=$('#fc');if(!fc){cb();return}fc.classList.add('anim');const W=innerWidth,H=innerHeight;
  const tf={r:`translate(${W}px,0) rotate(18deg)`,l:`translate(${-W}px,0) rotate(-18deg)`,u:`translate(0,${-H}px)`,d:`translate(0,${H}px)`}[dir];
  fc.style.transform=tf;fc.style.opacity='0';setTimeout(cb,230)}
function snapBack(){const fc=$('#fc');if(!fc)return;fc.classList.add('anim');fc.style.transform='';fc.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}
function bindSwipe(){
  const fc=$('#fc');if(!fc)return;let x0,y0,dx=0,dy=0,drag=false,moved=false;
  const sk=fc.querySelector('.stamp.k'),sn=fc.querySelector('.stamp.n');
  fc.addEventListener('pointerdown',e=>{if(e.target.closest('.spk'))return;x0=e.clientX;y0=e.clientY;dx=dy=0;drag=true;moved=false;fc.classList.remove('anim');fc.setPointerCapture(e.pointerId)});
  fc.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-x0;dy=e.clientY-y0;if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;
    if(Math.abs(dx)>=Math.abs(dy)){fc.style.transform=`translate(${dx}px,${dy*.2}px) rotate(${dx/18}deg)`;sk.style.opacity=Math.max(0,Math.min(1,dx/90));sn.style.opacity=Math.max(0,Math.min(1,-dx/90))}
    else{fc.style.transform=`translate(0,${dy}px)`;sk.style.opacity=sn.style.opacity=0}});
  const end=()=>{if(!drag)return;drag=false;
    if(!moved){snapBack();flipCard();return}
    if(Math.abs(dx)>=Math.abs(dy)){if(dx>90)return rate('know','r');if(dx<-90)return rate('nope','l')}
    else{if(dy<-80)return move(1);if(dy>80)return move(-1)}
    snapBack()};
  fc.addEventListener('pointerup',end);fc.addEventListener('pointercancel',()=>{drag=false;snapBack()});
}

function aiHTML(x){return `<div class="ai">${x.pos?`<p><b>Сөз табы:</b> ${esc(x.pos)}</p>`:''}${x.hanja?`<p><b>Ханча:</b> ${esc(x.hanja)}</p>`:''}${x.etym?`<p><b>Шығу тегі:</b> ${esc(x.etym)}</p>`:''}${x.note?`<p><b>Қолданысы:</b> ${esc(x.note)}</p>`:''}${x.rel?`<p><b>Түбірлес сөздер:</b> ${esc(x.rel)}</p>`:''}</div>`}

async function lookup(raw,el,ctx){

function ytId(u){const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|live\/|embed\/)([\w-]{11})/);return m?m[1]:null}
function ytLink(it){const id=ytId(it.url);if(!id)return it.url;return `https://www.youtube.com/watch?v=${id}${it.t?`&t=${it.t}s`:''}`}
const fmt=s=>{s=+s||0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const parseT=v=>{const p=String(v).trim().split(':').map(Number);if(p.some(isNaN))return 0;return p.reduce((a,b)=>a*60+b,0)};
function mediaList(){return Store.sharedMedia!==null&&Store.db?Store.sharedMedia.slice().sort((a,b)=>(b.at||'').localeCompare(a.at||'')):Store.media}
function viewMedia(m){
  let h=`<h2 class="sec">Медиа</h2><div class="seg"><button class="${S.mSub==='lib'?'on':''}" data-msub="lib">Подборка</button><button class="${S.mSub==='mine'?'on':''}" data-msub="mine">Менің жинағым</button><button class="${S.mSub==='video'?'on':''}" data-msub="video">Офлайн видео</button></div>`;
  if(S.mSub==='lib'){
    h+=`<p class="muted small">Сілтеме YouTube қосымшасында ашылады. Сандар — TOPIK деңгейі.</p>`;
    CUR.forEach(sec=>{h+=`<h3 class="blk">${esc(sec.h)}</h3><div class="card-list" style="padding:0">${sec.items.map(([t,u,l,d])=>`<div class="mitem"><div class="mi">${/youtube/.test(u)?'▶':'🎧'}</div><div class="mt"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a><span class="lvl-tag">${esc(l)}</span><small>${esc(d)}</small></div></div>`).join('')}</div>`});
  }else if(S.mSub==='mine'){
    const list=mediaList();
    h+=`<div class="note">YouTube-та видеоны ашып: <b>Бөлісу → Көшіру</b>. Содан кейін осында сілтемені қойыңыз. Қай жерде тоқтағаныңызды жазып қойсаңыз, келесіде сол жерден ашылады.</div>
    <div class="form"><input id="mUrl" placeholder="YouTube сілтемесі" inputmode="url" autocomplete="off"><input id="mTitle" placeholder="Атауы (міндетті емес)"><button class="btn" id="mAdd">+ Жинаққа қосу</button></div>
    <div class="card-list" style="padding:0">${list.length?list.map((it,i)=>`<div class="mitem"><div class="mi">▶</div><div class="mt"><a href="${esc(ytLink(it))}" target="_blank" rel="noopener">${esc(it.title||'YouTube видео')}</a><small>${it.t?`Тоқтаған жер: ${fmt(it.t)}`:'Әлі көрілмеген'}</small></div><input class="time-in" data-mt="${esc(it.id||i)}" placeholder="12:30" value="${it.t?fmt(it.t):''}" aria-label="Тоқтаған уақыт"><button class="icon-btn" data-mdel="${esc(it.id||i)}" aria-label="Өшіру">${IC.x}</button></div>`).join(''):'<div class="mitem"><div class="mt"><small>Жинақ бос. Жоғарыда бірінші видеоны қосыңыз.</small></div></div>'}</div>`;
  }else{
    h+=`<p class="muted small">Телефондағы видео мен корейше .srt субтитрді таңдаңыз. Интернетсіз жұмыс істейді. Экран сөнсе де дыбыс жалғасады. Субтитрдегі сөзді басыңыз — аударма.</p>
    <div class="file-row"><label class="file-btn">🎬 Видео<small id="vName">${V.vname||'таңдалмаған'}</small><input type="file" id="vIn" accept="video/*" hidden></label><label class="file-btn">💬 Субтитр .srt<small id="sName">${V.sname||'таңдалмаған'}</small><input type="file" id="sIn" accept=".srt,text/plain" hidden></label></div>
    <div class="vwrap"><video id="vid" playsinline controls ${V.url?`src="${V.url}"`:''}></video></div>
    <div class="vsub" id="vsub"><span class="muted small" style="font-family:var(--f-body)">Субтитр осында шығады</span></div>
    <div class="row-gap" style="margin-top:8px;justify-content:center"><button class="btn sm ghost" data-vskip="-5">⟲ 5с</button><button class="btn sm ghost" data-vrep>Сөйлемді қайталау</button><button class="btn sm ghost" data-vskip="5">5с ⟳</button></div>`;
  }
  m.innerHTML=h;
  if(S.mSub==='video')bindVideo();
  if(S.mSub==='mine'){$('#mAdd').onclick=addMedia}
}
async function addMedia(){
  const url=$('#mUrl').value.trim();const title=$('#mTitle').value.trim();
  if(!ytId(url)){toast('YouTube сілтемесі танылмады');return}
  const it={url,title:title||'',t:0,at:new Date().toISOString()};
  if(Store.db){try{await Store.db.collection('media').add(it);toast('Қосылды')}catch(e){Store.media.unshift(it);LS.set('media',Store.media);toast('Тек осы телефонда сақталды');render()}}
  else{Store.media.unshift(it);Store.touch();toast('Қосылды');render()}
}
async function setMediaTime(id,val){
  const t=parseT(val);
  if(Store.db&&Store.sharedMedia){try{await Store.db.collection('media').doc(id).update({t})}catch(e){}}
  else{const it=Store.media[+id];if(it){it.t=t;Store.touch()}}
  toast('Сақталды: '+fmt(t));
}
async function delMedia(id){
  if(Store.db&&Store.sharedMedia){try{await Store.db.collection('media').doc(id).delete()}catch(e){toast('Өшірілмеді')}}
  else{Store.media.splice(+id,1);Store.touch();render()}
}

/* offline video + srt */
const V={url:null,vname:'',sname:'',subs:[],cur:-1};
function parseSRT(t){return t.replace(/\r/g,'').trim().split(/\n\s*\n/).map(b=>{const l=b.split('\n');const i=l.findIndex(x=>x.includes('-->'));if(i<0)return null;const [a,z]=l[i].split('-->').map(s=>{const m=s.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);return m?+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000:0});const txt=l.slice(i+1).join(' ').replace(/<[^>]+>|\{[^}]+\}/g,'').trim();return txt?{a,z,txt}:null}).filter(Boolean)}
function bindVideo(){
  const vid=$('#vid');
  $('#vIn').onchange=e=>{const f=e.target.files[0];if(!f)return;if(V.url)URL.revokeObjectURL(V.url);V.url=URL.createObjectURL(f);V.vname=f.name;vid.src=V.url;$('#vName').textContent=f.name};
  $('#sIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{V.subs=parseSRT(r.result);V.sname=f.name+' · '+V.subs.length;$('#sName').textContent=V.sname};r.readAsText(f,'UTF-8')};
  vid.ontimeupdate=()=>{const t=vid.currentTime;const i=V.subs.findIndex(s=>t>=s.a&&t<s.z);if(i!==V.cur){V.cur=i;$('#vsub').innerHTML=i<0?'&nbsp;':V.subs[i].txt.split(/\s+/).map(w=>`<span class="w" data-w="${esc(w)}" data-ctx="${esc(V.subs[i].txt)}">${esc(w)}</span>`).join(' ')}};
}

/* ───────── global events ───────── */
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(t.closest('a[href]')&&!t.closest('[data-w]'))return;
  if(el=t.closest('[data-say]')){e.stopPropagation();Speech.say(el.dataset.say,el);return}
  if(el=t.closest('[data-lv]'))return setLv(+el.dataset.lv);
  if(el=t.closest('[data-tab]'))return setTab(el.dataset.tab);
  if(el=t.closest('.w')){const ctx=el.dataset.ctx||el.closest('.s-ko')?.textContent||'';const vid=$('#vid');if(vid&&!vid.paused)vid.pause();return lookup(el.dataset.w,el,ctx)}
  if(el=t.closest('[data-word]'))return (closeSheet(),openSheet(wordBlock(el.dataset.word)));
  if(t.closest('[data-close-sheet]'))return closeSheet();
  if(el=t.closest('[data-deck]')){closeSheet();return openDeck(el.dataset.deck)}
  if(t.closest('[data-close-study]'))return closeStudy();
  if(t.closest('[data-restart]'))return openDeck(ST.id);
  if(el=t.closest('[data-rate]'))return rate(el.dataset.rate);
  if(el=t.closest('[data-prb]')){S.prBlock=+el.dataset.prb;render();return}
  if(el=t.closest('[data-gopr]')){const [b,p]=el.dataset.gopr.split(':');S.prBlock=+b;setTab('practice');setTimeout(()=>document.getElementById('pp-'+p)?.scrollIntoView({block:'start'}),60);return}
  if(el=t.closest('[data-playall]'))return playAll(+el.dataset.playall);
  if(el=t.closest('[data-csub]')){S.vSub=el.dataset.csub;render();return}
  if(el=t.closest('[data-msub]')){S.mSub=el.dataset.msub;render();return}
  if(el=t.closest('[data-addmy]')){const k=el.dataset.addmy;const x=lexOf(k);Store.my[k]={ko:x.ko,kz:x.kz,ru:x.ru,tr:x.tr,em:x.em};Store.touch();el.outerHTML='<button class="btn sm ghost" disabled>✓ Карточкада</button>';toast('«Менің сөздерім» картасына қосылды');return}
  if(el=t.closest('[data-addtmp]')){const k=el.dataset.addtmp;const x=(Store._tmp||{})[k]||LS.get('ai',{})[k];if(!x)return;Store.my[k]={ko:x.ko,kz:x.kz,ru:x.ru,tr:x.tr,em:x.em,pos:x.pos,hanja:x.hanja,etym:x.etym,note:x.note,ex:(x.ex||[]).slice(0,3)};Store.touch();el.outerHTML='<button class="btn sm ghost" disabled>✓ Карточкада</button>';toast('«Менің сөздерім» картасына қосылды');return}
  if(el=t.closest('[data-addown]')){const k=el.dataset.addown;const kz=($('#ownKz')?.value||'').trim();if(!kz){toast('Аудармасын жазыңыз');return}Store.my[k]={ko:k,kz,ru:'',tr:TR(k),em:'📝'};Store.touch();el.outerHTML='<button class="btn sm ghost" disabled>✓ Карточкада</button>';toast('«Менің сөздерім» картасына қосылды');return}
  if(el=t.closest('[data-unarch]')){SRS.unarch(el.dataset.unarch);closeSheet();toast('Архивтен шықты');render();return}
  if(el=t.closest('[data-more]'))return more(el.dataset.more,el);
  if(el=t.closest('[data-mdel]'))return delMedia(el.dataset.mdel);
  if(el=t.closest('[data-rate-speech]')){Speech.rate=+el.dataset.rateSpeech;LS.set('rate',Speech.rate);document.querySelectorAll('[data-rate-speech]').forEach(b=>b.classList.toggle('on',b===el));Speech.say('안녕하세요');return}
  if(el=t.closest('[data-vskip]')){const v=$('#vid');if(v)v.currentTime=Math.max(0,v.currentTime+ +el.dataset.vskip);return}
  if(t.closest('[data-vrep]')){const v=$('#vid');const s=V.subs[V.cur];if(v&&s){v.currentTime=s.a;v.play()}return}
  if(el=t.closest('.hide-kz .s-kz, .hide-kz .s-cq')){el.classList.toggle('show');return}
  if(t.closest('#searchBtn'))return (closeSheet(),openSearch());
  if(t.closest('#wishBtn'))return (closeSheet(),openWish());
});
document.addEventListener('change',e=>{
  if(e.target.id==='hideKz'){S.hideKz=e.target.checked;LS.set('hideKz',S.hideKz);document.querySelectorAll('.card-list[data-list]').forEach(l=>{l.classList.toggle('hide-kz',S.hideKz);l.querySelectorAll('.show').forEach(x=>x.classList.remove('show'))})}
  if(e.target.id==='showCq'){S.showCq=e.target.checked;LS.set('showCq',S.showCq);const y=scrollY;render();scrollTo(0,y)}
  if(e.target.id==='autoSay'){LS.set('autoSay',e.target.checked)}
  if(e.target.dataset.mt!==undefined)setMediaTime(e.target.dataset.mt,e.target.value);
});
document.addEventListener('keydown',e=>{if(!ST||$('.sheet'))return;
  if(e.key==='ArrowRight')rate('know');else if(e.key==='ArrowLeft')rate('nope');else if(e.key==='ArrowUp'){e.preventDefault();move(1)}else if(e.key==='ArrowDown'){e.preventDefault();move(-1)}else if(e.key===' '){e.preventDefault();flipCard()}});

bindLogin();
render();
Store.init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
